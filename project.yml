name: Whispree
options:
  bundleIdPrefix: com.scarkoo
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.3"
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.9.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 7e2b710
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: "1.1.6"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.0.0"
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    exactVersion: "1.0.0"

targets:
  Whispree:
    type: application
    platform: macOS
    sources:
      - path: Whispree
        excludes:
          - "**/.DS_Store"
          - "**/AGENTS.md"
          - "Vendor/**"
          - "Services/Auth/**"
          - "Services/ScreenCapture/**"
          - "Services/MediaPlayback/**"
          - "Services/BrowserContext/**"
          - "Services/TerminalContext/**"
          - "Services/LLM/OpenAIProvider.swift"
          - "Services/LLM/OpenAICompatibleProvider.swift"
          - "Services/LLM/GroqLLMProvider.swift"
          - "Services/LLM/LocalVisionProvider.swift"
          - "Services/STT/GroqSTTProvider.swift"
          - "Models/OpenAIModels.swift"
          - "Models/GroqLLMModel.swift"
          - "Models/CapturedScreenshot.swift"
          - "Views/ScreenshotSelectionView.swift"
    resources:
      - path: Whispree/Resources/Assets.xcassets
    postBuildScripts:
      - script: |
          DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/mlx-worker"
          mkdir -p "$DEST"
          cp "${SRCROOT}/mlx-worker/mlx_worker.py" "$DEST/"
          cp "${SRCROOT}/mlx-worker/mlx_llm_worker.py" "$DEST/"
          cp "${SRCROOT}/mlx-worker/pyproject.toml" "$DEST/"
          if [ -f "${SRCROOT}/mlx-worker/uv.lock" ]; then
            cp "${SRCROOT}/mlx-worker/uv.lock" "$DEST/"
          fi
        name: Copy mlx-worker to bundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scarkoo.whispree
        PRODUCT_NAME: Whispree
        INFOPLIST_FILE: Whispree/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Whispree/Resources/Whispree.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - package: WhisperKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
    entitlements:
      path: Whispree/Resources/Whispree.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true

  WhispreeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhispreeTests
        excludes:
          - "E2E/**"
          - "Services/LLMServiceTests.swift"
          - "Services/BrowserContextServiceTests.swift"
          - "Models/AppSettingsTests.swift"
          - "Models/DictationQueueTests.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scarkoo.whispree.tests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Whispree.app/Contents/MacOS/Whispree"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Whispree
