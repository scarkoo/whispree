name: Verify local-only hardening

on:
  push:
    branches:
      - security/local-only-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: local-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-local-only:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: brew install xcodegen uv

      - name: Verify Python dependency lock
        run: |
          cd mlx-worker
          uv lock --check

      - name: Preserve committed SwiftPM lock
        run: |
          test -f Whispree.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Whispree.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved "$RUNNER_TEMP/Package.resolved"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate security manifests
        run: |
          plutil -lint Whispree/Resources/Info.plist
          plutil -lint Whispree/Resources/Whispree.entitlements

      - name: Resolve Swift packages
        run: |
          xcodebuild -project Whispree.xcodeproj \
            -scheme Whispree \
            -resolvePackageDependencies

      - name: Verify SwiftPM lock is unchanged
        run: |
          cmp "$RUNNER_TEMP/Package.resolved" Whispree.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build local-only app
        run: |
          # mlx-swift-lm contains a pinned Swift macro target. Hosted CI cannot
          # interactively approve macro trust, so only macro validation is skipped.
          # Package plugin validation remains enabled.
          xcodebuild -project Whispree.xcodeproj \
            -scheme Whispree \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate Python sources
        run: python3 -m py_compile mlx-worker/mlx_worker.py mlx-worker/mlx_llm_worker.py
