name: Verify local-only hardening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-local-only:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install build tools
        run: brew install xcodegen

      - name: Preserve committed SwiftPM lock
        run: |
          test -f Whispree.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp Whispree.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved "$RUNNER_TEMP/Package.resolved"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate security manifests
        run: |
          plutil -lint Whispree/Resources/Info.plist
          plutil -lint Whispree/Resources/Whispree.entitlements

      - name: Resolve Swift packages
        run: |
          xcodebuild -project Whispree.xcodeproj \
            -scheme Whispree \
            -resolvePackageDependencies

      - name: Verify SwiftPM pins are unchanged
        run: |
          python3 - <<'PY'
          import json, os
          before = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "Package.resolved")))
          after = json.load(open("Whispree.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"))
          def pins(doc):
              return sorted(doc.get("pins", []), key=lambda item: item["identity"])
          if pins(before) != pins(after):
              raise SystemExit("SwiftPM resolved pins changed; update and review Package.resolved locally")
          PY

      - name: Build local-only app
        run: |
          # mlx-swift-lm contains a pinned Swift macro target. Hosted CI cannot
          # interactively approve macro trust, so only macro validation is skipped.
          # Package plugin validation remains enabled.
          xcodebuild -project Whispree.xcodeproj \
            -scheme Whispree \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

